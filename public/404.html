<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Shield</title>
    <meta name="description" content="The page you're looking for doesn't exist. Navigate back to Shield.">
    <link rel="icon" href="/Shld.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Coinbase Sans';
            src: url('/WOFF2/Coinbase-Sans/Coinbase_Sans-Regular-web-1.32.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Coinbase Sans';
            src: url('/WOFF2/Coinbase-Sans/Coinbase_Sans-Bold-web-1.32.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
        body {
            font-family: 'Coinbase Sans', 'Inter', sans-serif;
            background-color: #000000;
            color: #e4e4e7;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Glitch effect for 404 */
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        .glitch {
            animation: glitch 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            animation-play-state: paused;
        }
        .glitch:hover {
            animation-play-state: running;
        }
    </style>
</head>
<body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 border-b border-white/5 bg-black/70 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-semibold tracking-tighter text-white hover:text-zinc-300 transition-colors flex items-center gap-2">
                <img src="/Shld.png" alt="Shield Logo" class="w-5 h-5">
                Shield
            </a>
            <a href="/" class="text-sm text-zinc-400 hover:text-white transition-colors flex items-center gap-2">
                <iconify-icon icon="lucide:arrow-left" width="16"></iconify-icon>
                Back Home
            </a>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="min-h-screen flex items-center justify-center px-6 pt-16">
        <div class="max-w-2xl mx-auto text-center">

            <!-- 404 Text -->
            <div class="mb-8">
                <h1 class="text-8xl md:text-9xl font-bold text-white glitch cursor-default select-none">
                    404
                </h1>
            </div>

            <!-- Shield Logo -->
            <div class="mb-8">
                <img src="/Shld.png" alt="Shield" class="w-20 h-20 mx-auto opacity-50">
            </div>

            <!-- Message -->
            <div class="glass-panel rounded-2xl p-8 md:p-12 mb-8">
                <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4">
                    Page Not Found
                </h2>
                <p class="text-zinc-400 text-lg mb-2">
                    The page you're looking for doesn't exist or has been moved.
                </p>
                <p class="text-zinc-500 text-sm">
                    It might be encrypted and only accessible by the intended recipient.
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/" class="w-full sm:w-auto px-8 py-3 bg-white text-black rounded-full font-medium hover:bg-zinc-200 transition-colors flex items-center justify-center gap-2">
                    <iconify-icon icon="lucide:home" width="18"></iconify-icon>
                    Go Home
                </a>
                <a href="https://app.shieldhq.xyz" class="w-full sm:w-auto px-8 py-3 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-full font-medium transition-colors flex items-center justify-center gap-2">
                    <iconify-icon icon="lucide:rocket" width="18"></iconify-icon>
                    Launch App
                </a>
            </div>

            <!-- Suggested Links -->
            <div class="mt-12 pt-8 border-t border-white/5">
                <p class="text-zinc-500 text-sm mb-4">You might be looking for:</p>
                <div class="flex flex-wrap justify-center gap-3">
                    <a href="/token" class="px-4 py-2 rounded-full glass-panel text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                        $SHLD Token
                    </a>
                    <a href="/#about" class="px-4 py-2 rounded-full glass-panel text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                        About
                    </a>
                    <a href="/#faq" class="px-4 py-2 rounded-full glass-panel text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                        FAQ
                    </a>
                    <a href="https://docs.shieldhq.xyz" class="px-4 py-2 rounded-full glass-panel text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                        Documentation
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 px-6 border-t border-white/5">
        <div class="max-w-7xl mx-auto text-center">
            <p class="text-zinc-600 text-sm">
                © 2026 Shield. Secure by design.
            </p>
        </div>
    </footer>

</body>
</html>
